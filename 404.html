<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0c">
  <title>Signal not found | Syntheta AI</title>
  <meta name="description" content="This Syntheta AI page could not be found.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --ink: #f3f0e8; --muted: #9d9b94; --line: #292a27; --accent: #ef4b3e; --cyan: #6ddbd5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0d0d0c; color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 32px 22px; }
    .shell { width: min(720px, 100%); }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .mark { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--cyan); color: var(--cyan); font-size: 16px; }
    .rule { height: 1px; margin: 30px 0 58px; background: var(--line); }
    .eyebrow { color: var(--cyan); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { max-width: 620px; margin: 16px 0 20px; font-size: clamp(42px, 9vw, 86px); line-height: .96; letter-spacing: -.04em; }
    h1 span { color: var(--accent); }
    p { max-width: 510px; margin: 0; color: var(--muted); font-size: 17px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
    a.button { display: inline-flex; align-items: center; min-height: 44px; padding: 0 17px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 700; }
    a.button.primary { border-color: var(--accent); background: var(--accent); color: #160b09; }
    a.button:hover { border-color: var(--cyan); }
    footer { margin-top: 86px; color: #666761; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    @media (max-width: 520px) { .rule { margin: 24px 0 44px; } h1 { font-size: 54px; } footer { margin-top: 60px; } }
  </style>
</head>
<body>
  <main>
    <section class="shell" aria-labelledby="page-title">
      <a class="brand" href="/" aria-label="Syntheta AI home"><span class="mark">∿</span> Syntheta AI</a>
      <div class="rule"></div>
      <div class="eyebrow">Signal lost · 404</div>
      <h1 id="page-title">This route was not <span>captured.</span></h1>
      <p>The page you requested is not in the current dataset. Return to the main workspace and continue from a real capture.</p>
      <div class="actions">
        <a class="button primary" href="/">Back to Syntheta</a>
        <a class="button" href="/#samples">View the pipeline</a>
      </div>
      <footer>Anchored training infrastructure for physical AI</footer>
    </section>
  </main>
</body>
</html>
